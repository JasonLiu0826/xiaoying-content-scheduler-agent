name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run evaluate -- --model mock --out .runtime/ci-evaluation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evidence-${{ matrix.os }}
          path: .runtime/ci-evaluation
          include-hidden-files: true
